[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubiflow"
version = "1.0.0"
description = "High-Performance Async Python Framework for Rubika Messenger and SuperApp"
readme = "README.md"
authors = [{ name = "RubiFlow Developers" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0"
]
keywords = ["rubika", "rubiflow", "rubika-bot", "async-rubika", "messenger", "superapp"]

[tool.setuptools.packages.find]
include = ["rubiflow*"]
